services:
  postgres:
    image: postgres:15
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  redis:
    image: redis:7-alpine
    container_name: crm_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: crm_minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"     # S3 API Port
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # MinIO Web Console Port
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  createbuckets:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: crm_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin};
      mc mb --ignore-existing local/${AWS_S3_BUCKET:-crm-enterprise-bucket};
      exit 0;
      "
    networks:
      - crm_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 1.0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    environment: &backend-runtime-environment
      - ENVIRONMENT=development
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://minio:9000}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-crm-enterprise-bucket}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - ./backend:/app
    networks:
      - crm_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_celery_worker
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    mem_limit: 1g
    cpus: 1.0
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO
    env_file:
      - ./backend/.env
    environment: *backend-runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    networks:
      - crm_network
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          celery -A app.workers.celery_app:celery_app inspect ping
          --destination=celery@$${HOSTNAME} --timeout=5
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_celery_beat
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 0.5
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO --pidfile=/tmp/celerybeat.pid
    env_file:
      - ./backend/.env
    environment: *backend-runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    networks:
      - crm_network
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/celerybeat.pid"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  crm_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
