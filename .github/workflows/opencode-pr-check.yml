name: OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  opencode-review:
    name: OpenCode PR Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenCode Review
        uses: anomalyco/opencode/github@v1.18.18
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            You are an automated PR reviewer. Reply in clean, human-readable
            GitHub-flavored Markdown ONLY — no JSON, no code fences wrapping
            the whole response.

            Before reviewing, read the AGENTS.md file at the root of this
            repository (if it exists). It contains rules written specifically
            to prevent issues that were previously flagged in past PR reviews
            from happening again. Treat every rule in AGENTS.md as mandatory
            for this review.

            Review this pull request for:
            - Bugs or logic errors
            - Security issues
            - Missing error handling
            - Code style violations
            - Violations of any rule listed in AGENTS.md (treat these as
              🔴 Errors, since they are known recurring issues the repo has
              explicitly asked to prevent)

            Format your reply EXACTLY like this:

            ## PR Review — ✅ LGTM
            (use this heading with ✅ only if there are zero issues, and stop
            here with one sentence saying why it looks good)

            OR, if there are issues:

            ## PR Review — ⚠️ N issue(s) found

            One-sentence overall summary of the PR and what's wrong.

            ### 🔴 Errors (must fix)
            - **`path/to/file.py` line 42** — Short description of the bug.
              _Fix:_ short suggested fix.
            - **`path/to/file.py` line 55** — [AGENTS.md rule violated: "<rule
              name>"] Short description.
              _Fix:_ short suggested fix.

            ### 🟡 Warnings (should fix)
            - **`path/to/file.tsx` line 72** — Short description.
              _Fix:_ short suggested fix.

            ### 🔵 Info (optional)
            - **`path/to/file.py` line 59** — Short description.
              _Fix:_ short suggested fix.

            Rules:
            - Skip any severity section that has zero findings (don't print
              an empty heading).
            - Keep each bullet to 1–2 lines. No long paragraphs.
            - Group findings under the correct severity only.
            - Any AGENTS.md rule violation must always be listed under
              🔴 Errors (must fix), even if it would otherwise seem minor,
              and must clearly name which AGENTS.md rule was violated.
            - Never wrap the whole answer in a JSON object or a single code
              fence — write it as normal Markdown so it renders nicely as a
              GitHub comment.