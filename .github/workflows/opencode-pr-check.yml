name: OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  opencode-review:
    name: OpenCode PR Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenCode Review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          prompt: |
            You are an automated PR reviewer. You MUST reply with a single valid JSON object ONLY (no markdown, no explanatory text).
            The JSON must exactly follow this schema:

            {
              "status": "LGTM" | "ISSUES",
              "summary": "one-sentence summary",
              "findings": [
                {
                  "file": "<path/to/file>",
                  "line": <number|null>,
                  "severity": "info" | "warning" | "error",
                  "message": "<short description>",
                  "suggested_fix": "<optional patch or code suggestion>"
                }
              ]
            }

            Review this pull request for:
            - Bugs or logic errors
            - Security issues
            - Missing error handling
            - Code style violations

            If there are no issues, set "status": "LGTM", "findings": [].
            Example valid response:
            {"status":"ISSUES","summary":"Two issues found","findings":[{"file":"src/foo.js","line":42,"severity":"error","message":"Null dereference","suggested_fix":"check for null before using"}]}